<section
    id="auth-section"
    class="grid gap-6 md:grid-cols-2"
>


    <!-- =====================================================
         REGISTRO
    ====================================================== -->

    <div
        class="rounded-2xl bg-white
               p-8 shadow-lg"
    >

        <h2
            class="mb-6 text-2xl
                   font-bold"
        >

            Crear cuenta

        </h2>


        <div class="space-y-4">


            <input
                id="register-name"
                type="text"
                placeholder="Nombre"
                class="w-full rounded-lg
                       border border-slate-300
                       p-3"
            >


            <input
                id="register-email"
                type="email"
                placeholder="Correo"
                class="w-full rounded-lg
                       border border-slate-300
                       p-3"
            >


            <input
                id="register-password"
                type="password"
                placeholder="Contraseña"
                class="w-full rounded-lg
                       border border-slate-300
                       p-3"
            >


            <button
                id="register-button"
                class="w-full rounded-lg
                       bg-slate-900
                       p-3 font-semibold
                       text-white
                       hover:bg-slate-800"
            >

                Registrarme

            </button>

        </div>

    </div>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <div
        class="rounded-2xl bg-white
               p-8 shadow-lg"
    >

        <h2
            class="mb-6 text-2xl
                   font-bold"
        >

            Iniciar sesión

        </h2>


        <div class="space-y-4">


            <input
                id="login-email"
                type="email"
                placeholder="Correo"
                class="w-full rounded-lg
                       border border-slate-300
                       p-3"
            >


            <input
                id="login-password"
                type="password"
                placeholder="Contraseña"
                class="w-full rounded-lg
                       border border-slate-300
                       p-3"
            >


            <button
                id="login-button"
                class="w-full rounded-lg
                       bg-indigo-600
                       p-3 font-semibold
                       text-white
                       hover:bg-indigo-700"
            >

                Ingresar

            </button>

        </div>

    </div>

</section>
