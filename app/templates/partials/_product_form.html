<div
    class="mb-8 rounded-2xl
           bg-white p-8 shadow-lg"
>


    <div class="mb-6">

        <h2
            id="form-title"
            class="text-2xl
                   font-bold"
        >

            Nuevo producto

        </h2>


        <p
            class="text-sm text-slate-500"
        >

            Administración del inventario

        </p>

    </div>


    <form
        id="product-form"
        class="grid gap-4 md:grid-cols-2"
    >


        <!-- Nombre -->

        <input
            id="product-name"
            type="text"
            placeholder="Nombre del producto"
            required
            class="rounded-lg border p-3"
        >


        <!-- Precio -->

        <input
            id="product-price"
            type="number"
            min="0"
            step="0.01"
            placeholder="Precio"
            required
            class="rounded-lg border p-3"
        >


        <!-- Stock -->

        <input
            id="product-stock"
            type="number"
            min="0"
            placeholder="Stock"
            required
            class="rounded-lg border p-3"
        >


        <!-- Descripción -->

        <input
            id="product-description"
            type="text"
            placeholder="Descripción"
            class="rounded-lg border p-3"
        >


        <!-- Botones -->

        <div
            class="flex gap-3 md:col-span-2"
        >

            <button
                type="submit"
                class="rounded-lg
                       bg-emerald-600
                       px-6 py-3
                       font-semibold
                       text-white
                       hover:bg-emerald-700"
            >

                Guardar producto

            </button>


            <button
                id="cancel-edit"
                type="button"
                class="rounded-lg
                       bg-slate-200
                       px-6 py-3
                       font-semibold
                       hover:bg-slate-300"
            >

                Limpiar

            </button>

        </div>

    </form>

</div>
